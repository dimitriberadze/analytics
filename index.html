<!DOCTYPE html>
<!--
	APM Dashboard — Analytics charts showcase (mock data, standalone).
	Loads the real Bank of Georgia design system from the CDN via an inline import map,
	exactly like the app does, so the bd-* components render identically. All chart data is
	mocked in showcase.js — no backend, no login, no build step.

	HOW TO RUN: this uses ES modules + an import map, so it must be served over HTTP
	(file:// is blocked by the browser). From this folder:
	    npx serve .        (or)   python3 -m http.server 8090
	then open the printed URL. See README.md.
-->
